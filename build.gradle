plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = 'io.github.poisonsheep.wishingfountain'
base { archivesName = "wishing_fountain-${minecraft_version}-fabric" }

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly ("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

jar {
    includeEmptyDirs = false
    from('LICENSE.txt') { rename { "${it}_wishing_fountain" } }
    from 'CREDITS.txt'
}
